<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Añadir Kiro 🐱</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080b14;

            background-image:
                linear-gradient(
                    rgba(8, 11, 20, 0.60),
                    rgba(8, 11, 20, 0.82)
                ),
                url("fondo-kiro.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;

            background: rgba(10, 15, 30, 0.88);

            border: 1px solid rgba(96, 165, 250, 0.35);

            border-radius: 20px;

            padding: 35px 25px;

            text-align: center;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 35px rgba(0, 0, 0, 0.45);
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .permissions {
            text-align: left;
            margin-top: 20px;
        }

        .permissions h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .permission {
            display: flex;
            align-items: center;
            gap: 12px;

            background: rgba(30, 41, 59, 0.65);

            border: 1px solid rgba(148, 163, 184, 0.15);

            border-radius: 10px;

            padding: 14px;

            margin-bottom: 10px;

            cursor: pointer;

            transition: 0.2s;
        }

        .permission:hover {
            border-color: rgba(96, 165, 250, 0.5);

            background: rgba(30, 41, 59, 0.9);
        }

        .permission input {
            width: 18px;
            height: 18px;

            accent-color: #22c55e;

            cursor: pointer;
        }

        .permission-text {
            flex: 1;
        }

        .permission-title {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .permission-description {
            color: #94a3b8;
            font-size: 13px;
        }

        .selected {
            margin-top: 20px;

            color: #86efac;

            font-size: 14px;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 30px;
        }

        .button {
            text-decoration: none;

            padding: 14px 22px;

            border-radius: 10px;

            font-weight: bold;

            border: 2px solid #86efac;

            cursor: pointer;

            transition: 0.2s;
        }

        .invite {
            background: #22c55e;

            color: #06120a;

            box-shadow:
                0 0 18px rgba(34, 197, 94, 0.25);
        }

        .invite:hover {
            background: #34d399;

            box-shadow:
                0 0 28px rgba(34, 197, 94, 0.55);

            transform: translateY(-2px);
        }

        .back {
            background: #7c3aed;

            color: white;

            box-shadow:
                0 0 18px rgba(124, 58, 237, 0.25);
        }

        .back:hover {
            background: #a78bfa;

            box-shadow:
                0 0 28px rgba(124, 58, 237, 0.55);

            transform: translateY(-2px);
        }

        .button:active {
            transform: scale(0.96);
        }

        @media (max-width: 600px) {

            .container {
                padding: 28px 18px;
            }

            h1 {
                font-size: 27px;
            }

            .logo {
                font-size: 42px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            🐱
        </div>

        <h1>
            Añadir Kiro a tu servidor
        </h1>

        <p class="description">
            Elige los permisos que quieres otorgarle a Kiro.
            Siempre podrás modificar los permisos posteriormente
            desde la configuración de Discord.
        </p>


        <div class="permissions">

            <h2>
                🔐 Permisos de Kiro
            </h2>


            <label class="permission">

                <input
                    type="checkbox"
                    id="viewChannels"
                >

                <div class="permission-text">

                    <div class="permission-title">
                        👁️ Ver canales
                    </div>

                    <div class="permission-description">
                        Permite a Kiro ver los canales del servidor.
                    </div>

                </div>

            </label>


            <label class="permission">

                <input
                    type="checkbox"
                    id="sendMessages"
                >

                <div class="permission-text">

                    <div class="permission-title">
                        💬 Enviar mensajes
                    </div>

                    <div class="permission-description">
                        Permite a Kiro enviar mensajes.
                    </div>

                </div>

            </label>


            <label class="permission">

                <input
                    type="checkbox"
                    id="manageMessages"
                >

                <div class="permission-text">

                    <div class="permission-title">
                        🧹 Gestionar mensajes
                    </div>

                    <div class="permission-description">
                        Necesario para funciones de moderación y limpieza.
                    </div>

                </div>

            </label>


            <label class="permission">

                <input
                    type="checkbox"
                    id="manageRoles"
                >

                <div class="permission-text">

                    <div class="permission-title">
                        🎭 Gestionar roles
                    </div>

                    <div class="permission-description">
                        Permite a Kiro gestionar roles según su configuración.
                    </div>

                </div>

            </label>


            <label class="permission">

                <input
                    type="checkbox"
                    id="moderateMembers"
                >

                <div class="permission-text">

                    <div class="permission-title">
                        🛡️ Moderar miembros
                    </div>

                    <div class="permission-description">
                        Permite utilizar determinadas funciones de moderación.
                    </div>

                </div>

            </label>


            <label class="permission">

                <input
                    type="checkbox"
                    id="manageChannels"
                >

                <div class="permission-text">

                    <div class="permission-title">
                        🏗️ Gestionar canales
                    </div>

                    <div class="permission-description">
                        Permite a Kiro crear o gestionar canales.
                    </div>

                </div>

            </label>

        </div>


        <div class="selected" id="selectedText">
            0 permisos seleccionados
        </div>


        <div class="buttons">

            <button
                class="button invite"
                onclick="inviteKiro()"
            >
                🐱 Invitar Kiro
            </button>


            <a
                href="index.html"
                class="button back"
            >
                ← Volver
            </a>

        </div>

    </div>


    <script>

        const checkboxes =
            document.querySelectorAll(
                'input[type="checkbox"]'
            );

        const selectedText =
            document.getElementById(
                "selectedText"
            );


        checkboxes.forEach(
            checkbox => {

                checkbox.addEventListener(
                    "change",
                    updateSelected
                );

            }
        );


        function updateSelected() {

            const selected =
                document.querySelectorAll(
                    'input[type="checkbox"]:checked'
                ).length;

            selectedText.textContent =
                selected +
                (selected === 1
                    ? " permiso seleccionado"
                    : " permisos seleccionados");
        }


        function inviteKiro() {

            let permissions = 0;


            /*
             * Discord permission bits
             */

            if (
                document.getElementById(
                    "viewChannels"
                ).checked
            ) {
                permissions += 1024;
            }


            if (
                document.getElementById(
                    "sendMessages"
                ).checked
            ) {
                permissions += 2048;
            }


            if (
                document.getElementById(
                    "manageMessages"
                ).checked
            ) {
                permissions += 8192;
            }


            if (
                document.getElementById(
                    "manageRoles"
                ).checked
            ) {
                permissions += 268435456;
            }


            if (
                document.getElementById(
                    "moderateMembers"
                ).checked
            ) {
                permissions += 1099511627776;
            }


            if (
                document.getElementById(
                    "manageChannels"
                ).checked
            ) {
                permissions += 16;
            }


            const inviteURL =
                "https://discord.com/oauth2/authorize" +
                "?client_id=1535161459347169311" +
                "&scope=bot%20applications.commands" +
                "&permissions=" +
                permissions;


            window.location.href =
                inviteURL;
        }

    </script>

</body>
  </html>
